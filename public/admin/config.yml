  - name: custom_pages
    label: Halaman custom
    label_singular: Halaman
    description: Halaman tambahan seperti Layanan, Harga, atau FAQ. Setelah dibuat, tambahkan ke menu di Pengaturan Situs → Navigasi.
    folder: src/content/custom-pages
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{fields.slug}}"
    summary: "{{title}} — /{{fields.slug}}"
    sortable_fields:
      - title
    fields:
      - name: title
        label: Judul halaman
        widget: string
        hint: Tampil di tab browser dan sebagai judul besar. Maks. 80 karakter
        required: true
        maxlength: 80
      - name: slug
        label: Alamat URL
        widget: string
        hint: "Huruf kecil, angka, dan tanda hubung. Contoh: layanan → namaweb.com/layanan. Tidak boleh: admin, projects, about, dev, uploads, 404."
        required: true
        pattern:
          - ^[a-z0-9]+(-[a-z0-9]+)*$
          - Huruf kecil, angka, dan tanda hubung saja
      - name: pageHeader
        label: Header halaman
        widget: object
        hint: Judul + sub-judul di atas konten. Matikan bila section pertama adalah Hero.
        required: false
        collapsed: true
        fields:
          - name: enabled
            label: Tampilkan
            widget: boolean
            default: true
            required: false
          - name: eyebrow
            label: Teks kecil di atas judul
            widget: string
            hint: Maks. 40 karakter
            required: false
            maxlength: 40
          - name: subtitle
            label: Sub-judul
            widget: text
            hint: Maks. 200 karakter
            required: false
            maxlength: 200
          - name: image
            label: Gambar
            widget: image
            hint: Opsional. Rasio 12:5 (lebar).
            required: false
          - name: imageAlt
            label: Deskripsi gambar (alt)
            widget: string
            hint: Jelaskan isi gambar untuk pembaca layar & Google. Wajib bila ada gambar. Maks. 160 karakter
            required: false
            maxlength: 160
          - name: imageEdge
            label: Efek tepi gambar
            widget: select
            options:
              - label: "Tanpa efek: gambar tampil penuh"
                value: none
              - label: "Bingkai: sudut membulat + garis tipis"
                value: frame
              - label: "Vignette: tepi memudar halus ke warna latar"
                value: vignette
              - label: "Pudar bawah: bagian bawah memudar ke latar"
                value: fade-bottom
              - label: "Vignette gelap: tepi menggelap seperti lensa kamera"
                value: dark-vignette
              - label: "Larut: keempat tepi memudar ke latar (cocok untuk foto di latar gelap)"
                value: dissolve
              - label: "Gelap dari kiri: sisi kiri menyatu ke latar supaya teks di atasnya terbaca"
                value: fade-left
            hint: "Cara tepi gambar ditampilkan. Default: Bingkai."
            required: false
          - name: edgeIntensity
            label: Intensitas efek
            widget: select
            options:
              - label: Halus
                value: soft
              - label: Sedang
                value: medium
              - label: Kuat
                value: strong
            default: medium
            hint: Seberapa kuat efek tepi. Tidak berpengaruh bila Efek tepi = Tanpa efek atau Bingkai.
            required: false
      - name: sections
        label: Section
        label_singular: Section
        widget: list
        hint: Tambah, hapus, dan seret untuk mengubah urutan. Matikan "Tampilkan" untuk menyembunyikan sementara.
        required: true
        min: 1
        types:
          - name: hero
            label: Hero (pembuka besar)
            summary: "{{headline}}"
            fields:
              - name: enabled
                label: Tampilkan
                widget: boolean
                default: true
                required: false
                hint: Matikan untuk menyembunyikan section tanpa menghapusnya.
              - name: variant
                label: Gaya tampilan
                widget: select
                options:
                  - label: "Split: teks kiri, foto kanan"
                    value: split
                  - label: "Tengah: tipografi besar di tengah"
                    value: centered
                  - label: "Layar penuh: foto/video penuh dengan teks di atasnya"
                    value: fullbleed
                  - label: "Spotlight: foto muncul dari gelap, nama raksasa di bawahnya"
                    value: spotlight
                  - label: "Showcase: kartu gelap besar, teks kiri, foto kanan, panel kaca"
                    value: showcase
                  - label: "Cutout: subjek tanpa latar di depan nama raksasa"
                    value: cutout
                default: split
                hint: Tata letak hero.
                required: true
              - name: eyebrow
                label: Teks kecil di atas judul
                widget: string
                hint: 'Contoh: "Desainer · Yogyakarta". Maks. 40 karakter (Showcase: 32)'
                required: false
                maxlength: 40
              - name: headline
