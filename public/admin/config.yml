# DIBUAT OTOMATIS oleh scripts/cms-config.mjs. Jangan edit file ini langsung.
backend:
  name: github
  repo: USERNAME/portfolio
  branch: main
  commit_messages:
    create: 'CMS: buat {{collection}} "{{slug}}"'
    update: 'CMS: ubah {{collection}} "{{slug}}"'
    delete: 'CMS: hapus {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: upload "{{path}}"'
    deleteMedia: 'CMS: hapus media "{{path}}"'
media_folder: public/uploads
public_folder: /uploads
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2400
        height: 2400
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: settings
    label: Pengaturan Situs
    editor:
      preview: false
    files:
      - name: site
        label: Identitas & Kontak
        file: src/content/settings/site.json
        fields:
          - name: ownerName
            label: Nama
            widget: string
            hint: Tampil di navbar & judul halaman. Maks. 60 karakter
            required: true
            maxlength: 60
          - name: role
            label: Profesi
            widget: string
            hint: 'Contoh: "UI/UX Designer". Maks. 40 karakter'
            required: true
            maxlength: 40
          - name: logo
            label: Logo
            widget: image
            hint: Opsional. Kalau kosong, nama tampil sebagai teks.
            required: false
          - name: favicon
            label: Favicon
            widget: image
            hint: PNG persegi minimal 512 px.
            required: false
          - name: email
            label: Email
            widget: string
            hint: Dipakai di section Kontak & tombol salin email.
            required: true
            type: email
          - name: whatsapp
            label: Nomor WhatsApp
            widget: string
            hint: "Format 62xxx tanpa + atau spasi. Contoh: 6281234567890"
            required: false
            pattern:
              - ^62\d{8,14}$
              - "Format: 62 diikuti nomor, tanpa spasi"
          - name: socials
            label: Sosial media
            widget: list
            hint: ""
            required: false
            summary: "{{platform}}"
            fields:
              - name: platform
                label: Platform
                widget: select
                options:
                  - label: LinkedIn
                    value: LinkedIn
                  - label: Instagram
                    value: Instagram
                  - label: Behance
                    value: Behance
                  - label: Dribbble
                    value: Dribbble
                  - label: GitHub
                    value: GitHub
                  - label: YouTube
                    value: YouTube
                  - label: TikTok
                    value: TikTok
                  - label: X
                    value: X
                hint: ""
                required: true
              - name: url
                label: Link profil
                widget: string
                hint: Link lengkap, diawali https://
                required: true
                type: url
          - name: cvFile
            label: File CV (PDF)
            widget: file
            required: false
            accept: application/pdf
            hint: Opsional. Memunculkan tombol "Download CV" di footer.
          - name: seo
            label: SEO
            widget: object
            hint: Tampilan di Google & saat link dibagikan.
            required: true
            collapsed: false
            fields:
              - name: description
                label: Deskripsi situs
                widget: text
                hint: Muncul di Google. Maks. 160 karakter
                required: true
                maxlength: 160
              - name: ogImage
                label: Gambar preview link
                widget: image
                hint: 1200×630 px. Muncul saat link dibagikan di WhatsApp/LinkedIn.
                required: true
          - name: footerText
            label: Teks footer
            widget: string
            hint: Maks. 160 karakter
            required: false
            maxlength: 160
          - name: language
            label: Bahasa situs
            widget: select
            options:
              - label: Bahasa Indonesia
                value: id
              - label: English
                value: en
            default: id
            hint: Bahasa teks tombol, label form, dan menu bawaan di situs. Konten tetap Anda tulis sendiri.
            required: false
          - name: address
            label: Alamat
            widget: text
            hint: Tampil di footer. Maks. 200 karakter
            required: false
            maxlength: 200
          - name: nameSuffix
            label: Simbol di belakang nama
            widget: select
            options:
              - label: Tanpa simbol
                value: none
              - label: ®
                value: ®
              - label: ™
                value: ™
              - label: "*"
                value: "*"
            default: none
            hint: Tampil kecil di belakang nama (navbar Pill, hero Spotlight & Cutout).
            required: false
          - name: availability
            label: Status ketersediaan
            widget: object
            hint: Badge berisi titik hijau, mis. "Available" atau "Terima proyek".
            required: true
            collapsed: false
            fields:
              - name: enabled
                label: Tampilkan
                widget: boolean
                default: false
                required: false
              - name: label
                label: Teks status
                widget: string
                hint: Maks. 24 karakter
                required: false
                maxlength: 24
      - name: theme
        label: Tema & Animasi
        file: src/content/settings/theme.json
        fields:
          - name: preset
            label: Preset tema
            widget: select
            options:
              - label: "Editorial: majalah, hangat, elegan"
                value: editorial
              - label: "Minimal Mono: bersih, banyak ruang"
                value: mono
              - label: "Dark Studio: gelap, kontras, teknis"
                value: midnight
              - label: "Soft Pastel: lembut, ramah"
                value: soft
              - label: "Bold Brutalist: berani, grafis"
                value: brutal
              - label: "Jakarta Modern: modern, lokal"
                value: nusantara
              - label: "Noir Spotlight: hitam pekat, foto dari kegelapan"
                value: noir
              - label: "Rouge: putih bersih, aksen merah tua"
                value: rouge
            default: editorial
            hint: Menentukan font, sudut, bayangan, dan warna awal.
            required: true
          - name: backgroundColor
            label: Warna latar (opsional)
            widget: color
            allowInput: true
            required: false
            pattern:
              - ^#[0-9a-fA-F]{6}$
              - "Format hex, contoh #F5F1EA"
            hint: Kosongkan untuk memakai warna preset. Warna bisa digeser sedikit otomatis demi keterbacaan.
          - name: textColor
            label: Warna teks (opsional)
            widget: color
            allowInput: true
            required: false
            pattern:
              - ^#[0-9a-fA-F]{6}$
              - "Format hex, contoh #1A1A1A"
            hint: Kosongkan untuk memakai warna preset. Bila kurang kontras dengan latar, otomatis digelapkan/diterangkan.
          - name: accentColor
            label: Warna aksen (opsional)
            widget: color
            allowInput: true
            required: false
            pattern:
              - ^(#[0-9a-fA-F]{6}|auto)$
              - "Format hex (contoh #C2410C) atau ketik auto"
            hint: Warna tombol & link. Kosongkan untuk memakai warna preset. Ketik "auto" untuk mengambil warna dari foto hero Beranda. Bisa digeser sedikit demi keterbacaan.
          - name: motion
            label: Animasi
            widget: select
            options:
              - label: Penuh
                value: full
              - label: Halus (fade saja)
                value: subtle
              - label: Mati
                value: off
            default: full
            hint: Level animasi seluruh situs.
            required: true
      - name: navigation
        label: Navigasi (Menu)
        file: src/content/settings/navigation.json
        fields:
          - name: navStyle
            label: Gaya navbar
            widget: select
            options:
              - label: "Standar: nama, menu, tombol"
                value: default
              - label: "Pill: nama + status, tombol Menu"
                value: pill
              - label: "Kaca tengah: menu di pill kaca (cocok dengan hero Showcase)"
                value: glass-center
            default: default
            hint: Tampilan navbar di semua halaman.
            required: false
          - name: mainMenu
            label: Menu navbar
            widget: list
            hint: Maks. 6 item. Seret untuk mengubah urutan. Halaman custom harus dibuat dulu sebelum bisa ditautkan.
            required: false
            max: 6
            summary: "{{label}}"
            fields:
              - name: label
                label: Teks menu
                widget: string
                hint: Maks. 30 karakter
                required: true
                maxlength: 30
              - name: linkType
                label: Jenis link
                widget: select
                options:
                  - label: Halaman bawaan
                    value: builtin
                  - label: Halaman custom
                    value: custom
                  - label: Link luar (URL)
                    value: external
                  - label: Tanpa link (hanya membuka dropdown)
                    value: none
                default: builtin
                hint: Pilih jenisnya, lalu isi SATU field tujuan di bawah yang sesuai. "Tanpa link" hanya untuk item menu navbar yang punya submenu.
                required: true
              - name: builtinPage
                label: Halaman bawaan
                widget: select
                options:
                  - label: Beranda
                    value: home
                  - label: Daftar Proyek
                    value: projects
                  - label: About
                    value: about
                  - label: Bagian Kontak (#kontak)
                    value: "#kontak"
                hint: Isi bila Jenis link = Halaman bawaan.
                required: false
              - name: customPage
                label: Halaman custom
                widget: relation
                collection: custom_pages
                value_field: "{{fields.slug}}"
                display_fields:
                  - "{{fields.title}} (/{{fields.slug}})"
                search_fields:
                  - title
                  - slug
                filters:
                  - field: draft
                    values:
                      - false
                required: false
                hint: Isi bila Jenis link = Halaman custom. Halaman draft tidak muncul di sini.
              - name: url
                label: URL eksternal
                widget: string
                hint: "Isi bila Jenis link = Link luar. Contoh: https://instagram.com/nama"
                required: false
              - name: openNewTab
                label: Buka di tab baru
                widget: boolean
                default: false
                required: false
              - name: children
                label: Submenu (dropdown)
                widget: list
                hint: Opsional. Bila diisi, item ini membuka daftar dropdown. Maks. 12 item.
                required: false
                max: 12
                summary: "{{label}}"
                fields:
                  - name: label
                    label: Teks submenu
                    widget: string
                    hint: Maks. 40 karakter
                    required: true
                    maxlength: 40
                  - name: linkType
                    label: Jenis link
                    widget: select
                    options:
                      - label: Halaman bawaan
                        value: builtin
                      - label: Halaman custom
                        value: custom
                      - label: Link luar (URL)
                        value: external
                      - label: Tanpa link (hanya membuka dropdown)
                        value: none
                    default: builtin
                    hint: Pilih jenisnya, lalu isi SATU field tujuan di bawah yang sesuai. "Tanpa link" hanya untuk item menu navbar yang punya submenu.
                    required: true
                  - name: builtinPage
                    label: Halaman bawaan
                    widget: select
                    options:
                      - label: Beranda
                        value: home
                      - label: Daftar Proyek
                        value: projects
                      - label: About
                        value: about
                      - label: Bagian Kontak (#kontak)
                        value: "#kontak"
                    hint: Isi bila Jenis link = Halaman bawaan.
                    required: false
                  - name: customPage
                    label: Halaman custom
                    widget: relation
                    collection: custom_pages
                    value_field: "{{fields.slug}}"
                    display_fields:
                      - "{{fields.title}} (/{{fields.slug}})"
                    search_fields:
                      - title
                      - slug
                    filters:
                      - field: draft
                        values:
                          - false
                    required: false
                    hint: Isi bila Jenis link = Halaman custom. Halaman draft tidak muncul di sini.
                  - name: url
                    label: URL eksternal
                    widget: string
                    hint: "Isi bila Jenis link = Link luar. Contoh: https://instagram.com/nama"
                    required: false
          - name: ctaButton
            label: Tombol CTA navbar
            widget: object
            hint: Tombol menonjol di kanan navbar, contoh "Hubungi Saya".
            required: true
            collapsed: false
            fields:
              - name: enabled
                label: Tampilkan
                widget: boolean
                default: false
                required: false
              - name: label
                label: Teks tombol
                widget: string
                hint: Maks. 30 karakter
                required: false
                maxlength: 30
              - name: linkType
                label: Jenis link
                widget: select
                options:
                  - label: Halaman bawaan
                    value: builtin
                  - label: Halaman custom
                    value: custom
                  - label: Link luar (URL)
                    value: external
                  - label: Tanpa link (hanya membuka dropdown)
                    value: none
                default: builtin
                hint: Pilih jenisnya, lalu isi SATU field tujuan di bawah yang sesuai. "Tanpa link" hanya untuk item menu navbar yang punya submenu.
                required: true
              - name: builtinPage
                label: Halaman bawaan
                widget: select
                options:
                  - label: Beranda
                    value: home
                  - label: Daftar Proyek
                    value: projects
                  - label: About
                    value: about
                  - label: Bagian Kontak (#kontak)
                    value: "#kontak"
                hint: Isi bila Jenis link = Halaman bawaan.
                required: false
              - name: customPage
                label: Halaman custom
                widget: relation
                collection: custom_pages
                value_field: "{{fields.slug}}"
                display_fields:
                  - "{{fields.title}} (/{{fields.slug}})"
                search_fields:
                  - title
                  - slug
                filters:
                  - field: draft
                    values:
                      - false
                required: false
                hint: Isi bila Jenis link = Halaman custom. Halaman draft tidak muncul di sini.
              - name: url
                label: URL eksternal
                widget: string
                hint: "Isi bila Jenis link = Link luar. Contoh: https://instagram.com/nama"
                required: false
          - name: footerMenu
            label: Menu footer
            widget: list
            hint: Maks. 10 item, untuk halaman sekunder seperti FAQ.
            required: false
            max: 10
            summary: "{{label}}"
            fields:
              - name: label
                label: Teks menu
                widget: string
                hint: Maks. 30 karakter
                required: true
                maxlength: 30
              - name: linkType
                label: Jenis link
                widget: select
                options:
                  - label: Halaman bawaan
                    value: builtin
                  - label: Halaman custom
                    value: custom
                  - label: Link luar (URL)
                    value: external
                  - label: Tanpa link (hanya membuka dropdown)
                    value: none
                default: builtin
                hint: Pilih jenisnya, lalu isi SATU field tujuan di bawah yang sesuai. "Tanpa link" hanya untuk item menu navbar yang punya submenu.
                required: true
              - name: builtinPage
                label: Halaman bawaan
                widget: select
                options:
                  - label: Beranda
                    value: home
                  - label: Daftar Proyek
                    value: projects
                  - label: About
                    value: about
                  - label: Bagian Kontak (#kontak)
                    value: "#kontak"
                hint: Isi bila Jenis link = Halaman bawaan.
                required: false
              - name: customPage
                label: Halaman custom
                widget: relation
                collection: custom_pages
                value_field: "{{fields.slug}}"
                display_fields:
                  - "{{fields.title}} (/{{fields.slug}})"
                search_fields:
                  - title
                  - slug
                filters:
                  - field: draft
                    values:
                      - false
                required: false
                hint: Isi bila Jenis link = Halaman custom. Halaman draft tidak muncul di sini.
              - name: url
                label: URL eksternal
                widget: string
                hint: "Isi bila Jenis link = Link luar. Contoh: https://instagram.com/nama"
                required: false
  - name: pages
    label: Halaman
    files:
      - name: home
        label: Beranda
        file: src/content/pages/home.json
        fields:
          - name: sections
            label: Section
            label_singular: Section
            widget: list
            hint: Tambah, hapus, dan seret untuk mengubah urutan. Matikan "Tampilkan" untuk menyembunyikan sementara.
            required: false
            types:
              - name: hero
                label: Hero (pembuka besar)
                summary: "{{headline}}"
                fields:
                  - name: enabled
                    label: Tampilkan
                    widget: boolean
                    default: true
                    required: false
                    hint: Matikan untuk menyembunyikan section tanpa menghapusnya.
                  - name: variant
                    label: Gaya tampilan
                    widget: select
                    options:
                      - label: "Split: teks kiri, foto kanan"
                        value: split
                      - label: "Tengah: tipografi besar di tengah"
                        value: centered
                      - label: "Layar penuh: foto/video penuh dengan teks di atasnya"
                        value: fullbleed
                      - label: "Spotlight: foto muncul dari gelap, nama raksasa di bawahnya"
                        value: spotlight
                      - label: "Showcase: kartu gelap besar, teks kiri, foto kanan, panel kaca"
                        value: showcase
                      - label: "Cutout: subjek tanpa latar di depan nama raksasa"
                        value: cutout
                    default: split
                    hint: Tata letak hero.
                    required: true
                  - name: eyebrow
                    label: Teks kecil di atas judul
                    widget: string
                    hint: 'Contoh: "Desainer · Yogyakarta". Maks. 40 karakter (Showcase: 32)'
                    required: false
                    maxlength: 40
                  - name: headline
                    label: Judul besar
                    widget: string
                    hint: "Kalimat utama. Maks. 80 karakter (Showcase: 60). Tidak dipakai Spotlight & Cutout, yang menampilkan nama raksasa."
                    required: false
                    maxlength: 80
                  - name: subheadline
                    label: Sub-judul
                    widget: text
                    hint: Penjelasan singkat di bawah judul. Maks. 160 karakter
                    required: false
                    maxlength: 160
                  - name: image
                    label: Gambar
                    widget: image
                    hint: "Rasio 16:9 (Split: 4:5). Untuk Layar penuh, teks otomatis diberi overlay gelap supaya tetap terbaca."
                    required: false
                  - name: imageAlt
                    label: Deskripsi gambar (alt)
                    widget: string
                    hint: Jelaskan isi gambar untuk pembaca layar & Google. Wajib bila ada gambar. Maks. 160 karakter
                    required: false
                    maxlength: 160
                  - name: videoMp4
                    label: Video latar MP4 (opsional)
                    widget: file
                    required: false
                    hint: Hanya untuk gaya Layar penuh. Maks. 10 MB, tanpa suara. Gambar di atas wajib diisi sebagai poster.
                  - name: imageEdge
                    label: Efek tepi gambar
                    widget: select
                    options:
                      - label: "Tanpa efek: gambar tampil penuh"
                        value: none
                      - label: "Bingkai: sudut membulat + garis tipis"
                        value: frame
                      - label: "Vignette: tepi memudar halus ke warna latar"
                        value: vignette
                      - label: "Pudar bawah: bagian bawah memudar ke latar"
                        value: fade-bottom
                      - label: "Vignette gelap: tepi menggelap seperti lensa kamera"
                        value: dark-vignette
                      - label: "Larut: keempat tepi memudar ke latar (cocok untuk foto di latar gelap)"
                        value: dissolve
                      - label: "Gelap dari kiri: sisi kiri menyatu ke latar supaya teks di atasnya terbaca"
                        value: fade-left
                    hint: "Cara tepi gambar ditampilkan. Layar penuh: default Tanpa efek, Bingkai diabaikan. Gaya lain: default Bingkai."
                    required: false
                  - name: edgeIntensity
                    label: Intensitas efek
                    widget: select
                    options:
                      - label: Halus
                        value: soft
                      - label: Sedang
                        value: medium
                      - label: Kuat
                        value: strong
                    default: medium
                    hint: Seberapa kuat efek tepi. Tidak berpengaruh bila Efek tepi = Tanpa efek atau Bingkai.
                    required: false
                  - name: primaryCta
                    label: Tombol utama
                    widget: object
                    hint: Tombol berwarna aksen. Kosongkan teks tombol untuk menyembunyikan.
                    required: false
                    collapsed: true
                    fields:
                      - name: label
                        label: Teks tombol
                        widget: string
                        hint: Maks. 30 karakter
                        required: false
                        maxlength: 30
                      - name: linkType
                        label: Jenis link
                        widget: select
                        options:
                          - label: Halaman bawaan
                            value: builtin
                          - label: Halaman custom
                            value: custom
                          - label: Link luar (URL)
                            value: external
                          - label: Tanpa link (hanya membuka dropdown)
                            value: none
                        default: builtin
                        hint: Pilih jenisnya, lalu isi SATU field tujuan di bawah yang sesuai. "Tanpa link" hanya untuk item menu navbar yang punya submenu.
                        required: true
                      - name: builtinPage
                        label: Halaman bawaan
                        widget: select
                        options:
                          - label: Beranda
                            value: home
                          - label: Daftar Proyek
                            value: projects
                          - label: About
                            value: about
                          - label: Bagian Kontak (#kontak)
                            value: "#kontak"
                        hint: Isi bila Jenis link = Halaman bawaan.
                        required: false
                      - name: customPage
                        label: Halaman custom
                        widget: relation
                        collection: custom_pages
                        value_field: "{{fields.slug}}"
                        display_fields:
                          - "{{fields.title}} (/{{fields.slug}})"
                        search_fields:
                          - title
                          - slug
                        filters:
                          - field: draft
                            values:
                              - false
                        required: false
                        hint: Isi bila Jenis link = Halaman custom. Halaman draft tidak muncul di sini.
                      - name: url
                        label: URL eksternal
                        widget: string
                        hint: "Isi bila Jenis link = Link luar. Contoh: https://instagram.com/nama"
                        required: false
                  - name: secondaryCta
                    label: Tombol kedua
                    widget: object
                    hint: "Tombol bergaris. Showcase: dipakai bila Link video hero kosong. Kosongkan teks tombol untuk menyembunyikan."
                    required: false
                    collapsed: true
                    fields:
                      - name: label
                        label: Teks tombol
                        widget: string
                        hint: Maks. 30 karakter
                        required: false
                        maxlength: 30
                      - name: linkType
                        label: Jenis link
                        widget: select
                        options:
                          - label: Halaman bawaan
                            value: builtin
                          - label: Halaman custom
                            value: custom
                          - label: Link luar (URL)
                            value: external
                          - label: Tanpa link (hanya membuka dropdown)
                            value: none
                        default: builtin
                        hint: Pilih jenisnya, lalu isi SATU field tujuan di bawah yang sesuai. "Tanpa link" hanya untuk item menu navbar yang punya submenu.
                        required: true
                      - name: builtinPage
                        label: Halaman bawaan
                        widget: select
                        options:
                          - label: Beranda
                            value: home
                          - label: Daftar Proyek
                            value: projects
                          - label: About
                            value: about
                          - label: Bagian Kontak (#kontak)
                            value: "#kontak"
                        hint: Isi bila Jenis link = Halaman bawaan.
                        required: false
                      - name: customPage
                        label: Halaman custom
                        widget: relation
                        collection: custom_pages
                        value_field: "{{fields.slug}}"
                        display_fields:
                          - "{{fields.title}} (/{{fields.slug}})"
                        search_fields:
                          - title
                          - slug
                        filters:
                          - field: draft
                            values:
                              - false
                        required: false
                        hint: Isi bila Jenis link = Halaman custom. Halaman draft tidak muncul di sini.
                      - name: url
                        label: URL eksternal
                        widget: string
                        hint: "Isi bila Jenis link = Link luar. Contoh: https://instagram.com/nama"
                        required: false
                  - name: displayName
                    label: Nama raksasa
                    widget: string
                    hint: Hanya dipakai varian Spotlight & Cutout. Kosong = nama di Pengaturan Situs. Maks. 40 karakter
                    required: false
                    maxlength: 40
                  - name: serviceColumns
                    label: Kolom layanan
                    widget: list
                    hint: Hanya dipakai varian Spotlight & Showcase. Maks. 3 kolom.
                    required: false
                    max: 3
                    summary: "{{title}}"
                    fields:
                      - name: label
                        label: Label kecil
                        widget: string
                        hint: Opsional, mis. "01". Maks. 24 karakter
                        required: false
                        maxlength: 24
                      - name: title
                        label: Judul
                        widget: string
                        hint: Maks. 40 karakter
                        required: true
                        maxlength: 40
                      - name: description
                        label: Deskripsi
                        widget: text
                        hint: Maks. 90 karakter (2 baris)
                        required: true
                        maxlength: 90
                  - name: focusX
                    label: Titik fokus foto (horizontal)
                    widget: number
                    value_type: int
