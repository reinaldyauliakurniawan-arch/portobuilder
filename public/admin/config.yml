  - name: projects
    label: Proyek
    label_singular: Proyek
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{year}}"
    sortable_fields:
      - order
      - year
      - title
    fields:
      - name: title
        label: Judul
        widget: string
        hint: Alamat halaman dibuat otomatis dari judul. Maks. 80 karakter
        required: true
        maxlength: 80
      - name: category
        label: Kategori
        widget: select
        options:
          - label: Branding
            value: Branding
          - label: UI/UX
            value: UI/UX
          - label: Ilustrasi
            value: Ilustrasi
          - label: Video
            value: Video
        hint: ""
        required: true
      - name: year
        label: Tahun
        widget: number
        value_type: int
        hint: "Contoh: 2026"
        required: true
        min: 1990
        max: 2100
      - name: cover
        label: Gambar cover
        widget: image
        hint: Rasio 4:3. Tampil di kartu proyek.
        required: true
      - name: coverAlt
        label: Deskripsi cover (alt)
        widget: string
        hint: Maks. 160 karakter
        required: true
        maxlength: 160
      - name: summary
        label: Ringkasan
        widget: text
        hint: Tampil di kartu proyek, maks. 160 karakter
        required: true
        maxlength: 160
      - name: role
        label: Peran saya
        widget: string
        hint: Maks. 80 karakter
        required: false
        maxlength: 80
      - name: client
        label: Klien
        widget: string
        hint: Maks. 80 karakter
        required: false
        maxlength: 80
      - name: tools
        label: Tools
        widget: list
        required: false
        hint: "Contoh: Figma, Illustrator. Ditampilkan sebagai badge."
        field:
          name: tool
          label: Tool
          widget: string
          hint: ""
          required: true
          maxlength: 30
      - name: featured
        label: Unggulan
        widget: boolean
        default: false
        required: false
        hint: Muncul di section Proyek Unggulan.
      - name: order
        label: Urutan
        widget: number
        value_type: int
        hint: Opsional. Angka kecil tampil lebih dulu; kosong = urut tahun terbaru.
        required: false
      - name: gallery
        label: Galeri
        widget: list
        hint: Bisa diklik untuk diperbesar.
        required: false
        summary: "{{alt}}"
        fields:
          - name: image
            label: Gambar
            widget: image
            hint: ""
            required: true
          - name: alt
            label: Deskripsi (alt)
            widget: string
            hint: Maks. 160 karakter
            required: true
            maxlength: 160
          - name: caption
            label: Keterangan
            widget: string
            hint: Maks. 160 karakter
            required: false
            maxlength: 160
      - name: videos
        label: Video YouTube
        widget: list
        hint: Tempel link YouTube apa pun.
        required: false
        summary: "{{title}}"
        fields:
          - name: youtubeUrl
            label: Link YouTube
            widget: string
            hint: Video harus Public atau Unlisted.
            required: true
            pattern:
              - ^(https?://)?(www\.|m\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com)/.+
              - Harus link YouTube
          - name: title
            label: Judul video
            widget: string
            hint: Maks. 100 karakter
            required: true
            maxlength: 100
      - name: externalUrl
        label: Link live
        widget: string
        hint: Opsional. Memunculkan tombol "Lihat live".
        required: false
        type: url
      - name: draft
        label: Sembunyikan (draft)
        widget: boolean
        default: false
        required: false
        hint: Proyek draft tidak diterbitkan.
      - name: body
        label: Isi studi kasus
        widget: markdown
        hint: Ceritakan masalah, proses, dan hasil.
        required: false
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
        editor_components:
          - image
